name: Materialize standalone dermatology KG

on:
  push:
    branches:
      - feat/standalone-dermatology-kg
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          sparse-checkout: |
            .bootstrap
            .github/workflows
            dermatology_kg
            scripts
            src/dismech/export
            tests
          sparse-checkout-cone-mode: true
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Verify and materialize reviewed payload
        shell: bash
        run: |
          set -euo pipefail

          cat .bootstrap/dermkg.part* > /tmp/dermkg-payload.b64
          printf '%s  %s\n' \
            '793dc1cffe1ca596b334efc960b6370b4d5c5793d2ea7faf972f9c505caf83a5' \
            '/tmp/dermkg-payload.b64' | sha256sum --check --strict

          base64 --decode /tmp/dermkg-payload.b64 > /tmp/dermkg-payload.tar.gz
          printf '%s  %s\n' \
            '622401ce074b5a2b64ad1133b04fb38b2f23ecbc2d8dd0b3257fae0e86797343' \
            '/tmp/dermkg-payload.tar.gz' | sha256sum --check --strict

          if tar -tzf /tmp/dermkg-payload.tar.gz | grep -Eq '(^/|(^|/)\.\.(/|$))'; then
            echo 'Unsafe path in bootstrap payload' >&2
            exit 1
          fi

          tar -xzf /tmp/dermkg-payload.tar.gz -C .
          # GITHUB_TOKEN cannot push a newly added workflow file. The connector
          # adds the verified workflow in the subsequent clean commit.
          rm -f .github/workflows/dermatology-kg.yaml
          rm -rf .bootstrap .github/workflows/bootstrap-dermkg.yaml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'feat(dermkg): add standalone dermatology-focused distribution'
          target_branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          git push origin "HEAD:${target_branch}"
