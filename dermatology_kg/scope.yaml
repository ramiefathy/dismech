# Reviewed specialty-scope policy for the standalone dermatology distribution.
#
# Automatic rules may include only from structured identity metadata, an exact
# board-priority alias, a reviewed systemic co-management rule, or a sufficiently
# strong structured phenotype pattern. Description text is candidate-generation
# only. Uncertain candidates remain excluded until manual review.

policy_version: 1
name: DisMech dermatology specialty-scope policy
scope_statement: Include disorders that are primarily cutaneous, hair, nail, mucosal, or adnexal; conditions commonly diagnosed or longitudinally managed by dermatologists; and systemic or inherited disorders with sufficiently strong structured cutaneous manifestations. Exclude uncertain candidates until curator review.
governance:
  selection_mode: fail_closed
  description_text_can_auto_include: false
  manual_exclude_overrides_all: true
  source_records_are_transformed: false
  uncertain_candidates_are_quarantined: true
board_reference:
  organization: American Board of Dermatology
  document: BASIC Exam Content Outline
  document_last_updated: 2019
  reviewed_on: '2026-08-04'
  url: https://www.abderm.org/public/for-dermatologists/dermatology-residency-training-program/basic-exam/basic-exam-content-outline
  note: The list below is a scope-audit aid, not a claim that the outline is a complete clinical ontology or a current treatment guideline.
direct_metadata_rules:
- id: cutaneous_identity
  regex: \b(?:skin|cutaneous|dermat(?:itis|osis|oses|ologic|ological|opathy)|dermatosis|dermatoses)\b
  tier: PRIMARY_DERMATOLOGY
  domains:
  - medical_dermatology
- id: hair_scalp_identity
  regex: \b(?:hair|scalp|alopecia|hirsutism|hypertrichosis|trichotillomania|trichorrhexis|pili)\b
  tier: PRIMARY_DERMATOLOGY
  domains:
  - hair_and_scalp
- id: nail_identity
  regex: \b(?:nail|ungual|subungual|periungual|onych[a-z]+)\b
  tier: PRIMARY_DERMATOLOGY
  domains:
  - nail_disease
- id: mucocutaneous_identity
  regex: \b(?:mucocutaneous|oral mucos(?:a|al)|vulvar dermatosis|genital dermatosis)\b
  tier: PRIMARY_DERMATOLOGY
  domains:
  - mucosal_dermatology
- id: inflammatory_dermatoses
  regex: \b(?:acne|rosacea|psoriasis|urticaria|angioedema|hidradenitis|lichen(?:oid)?|pityriasis|pemphig(?:us|oid)|vitiligo|melasma|morphea|scleroderma|ichthyosis|prurigo)\b
  tier: PRIMARY_DERMATOLOGY
  domains:
  - medical_dermatology
- id: cutaneous_infection_or_infestation
  regex: \b(?:tinea|dermatophytosis|onychomycosis|scabies|pediculosis|impetigo|molluscum contagiosum|cutaneous leishmaniasis|leprosy|sporotrichosis)\b
  tier: PRIMARY_DERMATOLOGY
  domains:
  - cutaneous_infection
- id: genodermatosis_identity
  regex: \b(?:epidermolysis bullosa|xeroderma pigmentosum|darier disease|hailey[- ]hailey|incontinentia pigmenti|ectodermal dysplasia|pachyonychia congenita|keratoderma)\b
  tier: SYNDROMIC_DERMATOLOGY
  domains:
  - pediatric_dermatology
  - genodermatoses
- id: vascular_neutrophilic_granulomatous
  regex: \b(?:pyoderma gangrenosum|sweet syndrome|erythema nodosum|granuloma annulare|necrobiosis lipoidica|livedoid vasculopathy)\b
  tier: PRIMARY_DERMATOLOGY
  domains:
  - medical_dermatology
- id: pigment_and_benign_lesion_identity
  regex: \b(?:nevus|nevi|lentigo|lentigines|porokeratosis|seborrheic keratosis|actinic keratosis|acanthosis nigricans|dermatofibroma|pyogenic granuloma)\b
  tier: PRIMARY_DERMATOLOGY
  domains:
  - medical_dermatology
  - dermatologic_surgery
- id: cutaneous_oncology_identity
  regex: \b(?:cutaneous lymphoma|mycosis fungoides|sezary syndrome|skin cancer|cutaneous melanoma|dermatofibrosarcoma protuberans|merkel cell carcinoma|kaposi sarcoma)\b
  tier: PRIMARY_DERMATOLOGY
  domains:
  - cutaneous_oncology
  - dermatopathology
comanaged_name_rules:
- id: connective_tissue_disease
  regex: \b(?:systemic lupus erythematosus|cutaneous lupus|dermatomyositis|antisynthetase syndrome|systemic sclerosis|mixed connective tissue disease|relapsing polychondritis)\b
  tier: DERMATOLOGY_COMANAGED
  domains:
  - rheumatologic_dermatology
- id: vasculitis_and_vasculopathy
  regex: \b(?:beh[cç]et|polyarteritis nodosa|granulomatosis with polyangiitis|microscopic polyangiitis|eosinophilic granulomatosis with polyangiitis|cryoglobulinemia|cutaneous small vessel vasculitis|calciphylaxis|antiphospholipid syndrome)\b
  tier: DERMATOLOGY_COMANAGED
  domains:
  - rheumatologic_dermatology
  - vascular_dermatology
- id: granulomatous_infiltrative_metabolic
  regex: \b(?:sarcoidosis|amyloidosis|porphyria|pseudoxanthoma elasticum|fabry disease|hemochromatosis)\b
  tier: DERMATOLOGY_COMANAGED
  domains:
  - medical_dermatology
- id: neurocutaneous_and_tumor_syndromes
  regex: \b(?:neurofibromatosis|tuberous sclerosis|pten hamartoma tumor syndrome|cowden syndrome|bannayan[- ]riley[- ]ruvalcaba|birt[- ]hogg[- ]dub[eé]|gorlin syndrome|basal cell nevus syndrome|carney complex|peutz[- ]jeghers|multiple endocrine neoplasia type 2b)\b
  tier: SYNDROMIC_DERMATOLOGY
  domains:
  - genodermatoses
  - cutaneous_oncology
- id: histiocytic_and_mast_cell_disease
  regex: \b(?:langerhans cell histiocytosis|juvenile xanthogranuloma|erdheim[- ]chester|mastocytosis|mast cell disease)\b
  tier: DERMATOLOGY_COMANAGED
  domains:
  - pediatric_dermatology
  - dermatopathology
- id: graft_versus_host_disease
  regex: \b(?:graft[- ]versus[- ]host disease|graft versus host disease)\b
  tier: DERMATOLOGY_COMANAGED
  domains:
  - inpatient_dermatology
  - medical_dermatology
- id: sexually_transmitted_infections
  regex: \b(?:syphilis|chancroid|lymphogranuloma venereum|granuloma inguinale|donovanosis|anogenital warts)\b
  tier: DERMATOLOGY_COMANAGED
  domains:
  - mucosal_dermatology
  - cutaneous_infection
- id: nutritional_and_deficiency_dermatoses
  regex: \b(?:acrodermatitis enteropathica|pellagra|scurvy|zinc deficiency|biotin deficiency)\b
  tier: DERMATOLOGY_COMANAGED
  domains:
  - medical_dermatology
  - pediatric_dermatology
- id: severe_cutaneous_adverse_reactions
  regex: \b(?:stevens[- ]johnson syndrome|toxic epidermal necrolysis|dress syndrome|drug reaction with eosinophilia|acute generalized exanthematous pustulosis)\b
  tier: DERMATOLOGY_COMANAGED
  domains:
  - inpatient_dermatology
phenotype_rules:
  minimum_matches: 4
  minimum_matches_with_diagnostic: 2
  patterns:
  - id: primary_secondary_lesions
    regex: \b(?:rash|eruption|erythema|papule|plaque|pustule|vesicle|bulla|blister|wheal|comedone|scale|scaling|crust|erosion|ulcer|lichenification|excoriation|fissure|eschar|skin nodule|cutaneous nodule)\b
  - id: pigment_and_vascular_signs
    regex: \b(?:hyperpigmentation|hypopigmentation|depigmentation|cafe[- ]au[- ]lait|freckling|lentigines|telangiectasia|purpura|petechiae|ecchymosis|livedo|cyanosis)\b
  - id: surface_texture_and_symptoms
    regex: \b(?:hyperkeratosis|keratoderma|xerosis|pruritus|skin pain|skin fragility|photosensitivity|sclerodactyly|skin sclerosis|skin atrophy|scarring)\b
  - id: hair_signs
    regex: \b(?:alopecia|hair loss|hypotrichosis|hypertrichosis|hirsutism|hair shaft|woolly hair|scarring alopecia)\b
  - id: nail_signs
    regex: \b(?:nail dystrophy|onycholysis|onychomadesis|pitting of nails|clubbing|subungual|periungual|leukonychia|melanonychia)\b
  - id: mucosal_signs
    regex: \b(?:oral ulcer|aphthous ulcer|mucosal erosion|mucosal blister|genital ulcer|cheilitis|glossitis|gingival|oral pigmentation)\b
  - id: adnexal_and_sweat_signs
    regex: \b(?:anhidrosis|hypohidrosis|hyperhidrosis|sebaceous|follicular plugging|acneiform|hidradenitis)\b
candidate_description_rules:
- id: skin_or_cutaneous
  regex: \b(?:skin|cutaneous|dermatologic|dermatological)\b
- id: hair_or_nail
  regex: \b(?:hair|scalp|nail|ungual)\b
- id: mucosal_or_oral_ulcer
  regex: \b(?:mucocutaneous|mucosal|oral ulcer|genital ulcer)\b
- id: photosensitive_or_pigment
  regex: \b(?:photosensitiv|hyperpigment|hypopigment|depigment)\w*\b
manual_includes: []
manual_excludes: []
