registry_version: 2
name: High-priority comprehensive dermatology scope supplement
description: >-
  Reviewed condition-label registry spanning clinical dermatology, dermatopathology,
  rheumatology-dermatology overlap, genodermatoses, infection, neoplasia, emergencies,
  pregnancy, hair, nail, and mucosal disease. Entries are exact-label scope signals only;
  they do not add, rewrite, or validate scientific assertions.
source_basis:
- Differential Diagnosis for the Dermatologist, Second Edition (user-provided source and derived CSV)
- Interdisciplinary Approaches to Overlap Disorders in Dermatology & Rheumatology (user-provided source)
- Review of Dermatology (user-provided board-review source)
- Peer-reviewed literature and specialty-gap review, 2026-08-04
